<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portfolio Admin</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>


<body>

    <header class="admin-header">

        <div class="admin-container">

            <h1>
                Portfolio Admin
            </h1>

            <a
                href="../index.html"
                class="view-site-btn"
            >
                View Portfolio
            </a>

        </div>

    </header>


    <main class="admin-container">

        <!-- Profile -->

        <section class="admin-card">

            <h2>
                Profile Information
            </h2>

            <form id="profile-form">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="John Doe"
                    >

                </div>


                <div class="form-group">

                    <label for="bio">
                        Bio
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        rows="4"
                        placeholder="Write your bio..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Denmark"
                    >

                </div>


                <div class="form-group">

                    <label for="focus">
                        Professional Focus
                    </label>

                    <input
                        type="text"
                        id="focus"
                        name="focus"
                        placeholder="Development & Design"
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Profile
                </button>

            </form>

        </section>


        <!-- Add Project -->

        <section class="admin-card">

            <h2>
                Add Project
            </h2>

            <form id="project-form">

                <div class="form-group">

                    <label for="project-title">
                        Project Title
                    </label>

                    <input
                        type="text"
                        id="project-title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="project-description">
                        Description
                    </label>

                    <textarea
                        id="project-description"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="project-technologies">
                        Technologies
                    </label>

                    <input
                        type="text"
                        id="project-technologies"
                        placeholder="HTML, CSS, JavaScript"
                    >

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Add Project
                </button>

            </form>

        </section>


        <!-- Experience -->

        <section class="admin-card">

            <h2>
                Add Experience
            </h2>

            <form id="experience-form">

                <div class="form-group">

                    <label for="position">
                        Position
                    </label>

                    <input
                        type="text"
                        id="position"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="company">
                        Company
                    </label>

                    <input
                        type="text"
                        id="company"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="period">
                        Period
                    </label>

                    <input
                        type="text"
                        id="period"
                        placeholder="2024 - Present"
                    >

                </div>


                <div class="form-group">

                    <label for="experience-description">
                        Description
                    </label>

                    <textarea
                        id="experience-description"
                        rows="4"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Add Experience
                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="../js/admin.js"
    ></script>

</body>

</html>
